<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WechatJump</title>
    <script src="./js/lib/soundjs.min.js"></script>
</head>
<body>
    <div class="build-panel">
        <button class="build-agent" type="button">Build</button>
        <span class="build-status">Select a flow template to build an Agent skeleton</span>
    </div>

    <div class="editor-panel">
        <button class="panel-toggle" type="button">Collapse</button>
        <div class="editor-panel-body">
            <div class="editor-field task-field">
                <span>Task</span>
                <input class="task-input" type="text" placeholder="Enter your task">
                <button class="play-flow" type="button">Demo flow</button>
            </div>
            <div class="editor-field">
                <span>Flow template</span>
                <div class="flow-options"></div>
            </div>
            <div class="editor-field platform-field">
                <span>Platform style</span>
                <div class="platform-options"></div>
            </div>
            <button class="add-platform" type="button">Add platform</button>
            <button class="add-jumper" type="button">Add jumper</button>
            <div class="editor-tip">
                <span>Platforms: <span class="platform-count">0</span></span>
                <span class="placement-tip">Pick a flow, then a platform style</span>
                <span class="flow-demo-tip">Drag the canvas and zoom during the demo; the flow advances automatically.</span>
            </div>
        </div>
    </div>

    <div class="selection-menu">
        <div class="selection-menu-header">
            <button class="selection-tools-done" type="button">Done</button>
            <span class="selection-menu-title">Platform actions</span>
        </div>
        <div class="selection-menu-body">
            <button class="selection-jumper-select" type="button">Select tools</button>
            <button class="selection-delete" type="button">Delete platform</button>
            <input class="selection-task-input" type="text" placeholder="Agent responsibility, e.g. business branch">
            <button class="selection-task-save" type="button">Save responsibility</button>
        </div>
        <div class="selection-tool-body">
            <button class="selection-tool-option" type="button" data-tool-id="jupyter">
                <img src="./res/tool-icons/vscode.jpg" alt="Jupyter">
                <span>Jupyter</span>
            </button>
            <button class="selection-tool-option" type="button" data-tool-id="vscode">
                <img src="./res/tool-icons/jupyter.jpg" alt="VS Code">
                <span>VS Code</span>
            </button>
            <button class="selection-tool-option" type="button" data-tool-id="browser">
                <img src="./res/tool-icons/browser.jpg" alt="Browser">
                <span>Browser</span>
            </button>
        </div>
    </div>

    <div class="MyToast disappear">+0</div>
</body>
</html>
